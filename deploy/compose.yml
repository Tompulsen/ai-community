name: ai-community
services:
  web:
    image: ${COMMUNITY_IMAGE:-ghcr.io/tompulsen/ai-community:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    init: true
    healthcheck:
      test: [CMD, curl, --fail, --silent, --output, /dev/null, http://127.0.0.1:3000/healthz]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 120s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:13000:3000"
    environment:
      NODE_OPTIONS: --max-old-space-size=768
      COMMUNITY_STUDIO_UPSTREAM: http://studio:3000
    volumes:
      - ./private/config:/misskey/.config:ro
      - uploads:/misskey/files
    networks: [database, outbound]
    logging:
      options: {max-size: "10m", max-file: "3"}
  studio:
    image: ${COMMUNITY_STUDIO_IMAGE:-ghcr.io/tompulsen/ai-community-studio:latest}
    build:
      context: ../studio
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file: ./private/studio.env
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      COMMUNITY_INTERNAL_URL: http://web:3000
      DOCUMENT_SERVICE_URL: http://documents:3010
    depends_on:
      redis:
        condition: service_healthy
    networks: [database, outbound, accounts]
    logging:
      options: {max-size: "10m", max-file: "3"}
  documents:
    image: ${COMMUNITY_DOCUMENTS_IMAGE:-ghcr.io/tompulsen/ai-community-documents:latest}
    build:
      context: ..
      dockerfile: deploy/documents/Dockerfile
    restart: unless-stopped
    init: true
    env_file: ./private/documents.env
    volumes: [documents:/documents]
    networks: [database]
    mem_limit: 1536m
    cpus: 1.5
    pids_limit: 128
    read_only: true
    tmpfs: [/tmp:size=268435456,mode=1777]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      options: {max-size: "10m", max-file: "3"}
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file: ./private/database.env
    volumes:
      - postgres:/var/lib/postgresql
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      options: {max-size: "10m", max-file: "3"}
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes"]
    restart: unless-stopped
    volumes: [redis:/data]
    networks: [database]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      options: {max-size: "10m", max-file: "3"}
volumes:
  documents:
  postgres:
  redis:
  uploads:
networks:
  database:
    internal: true
  outbound:
  accounts:
    external: true
    name: ${NEW_API_NETWORK:-1panel-network}
