name: Build community container

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/community-container.yml'
      - '.dockerignore'
      - 'deploy/**'
      - 'packages/**'
      - 'packages-private/**'
      - 'scripts/**'
      - 'patches/**'
      - 'locales/**'
      - 'assets/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'healthcheck.sh'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: community-container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the community image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/tompulsen/ai-community:latest
            ghcr.io/tompulsen/ai-community:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=community-amd64
          cache-to: type=gha,mode=max,scope=community-amd64
