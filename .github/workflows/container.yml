name: Build container

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  following-postgres:
    name: Verify PostgreSQL regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container: node:24-bookworm
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: community_follow_test
          POSTGRES_USER: community_test
          POSTGRES_PASSWORD: community_test
        options: >-
          --health-cmd "pg_isready -U community_test -d community_follow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FOLLOWING_TEST_DATABASE_URL: postgresql://community_test:community_test@postgres:5432/community_follow_test
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install dependencies
        run: npm ci

      - name: Run PostgreSQL integration tests
        run: node --test server/following.test.mjs server/lottery-daily.test.mjs server/lottery-public.test.mjs server/lottery-summary.test.mjs server/publication-reward.test.mjs server/account-session.test.mjs server/discovery.test.mjs server/admin-users.test.mjs server/content-performance.test.mjs server/lottery-status.test.mjs server/media-visibility.test.mjs server/community-skills.test.mjs server/welfare-points.test.mjs

  container:
    needs: following-postgres
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: community
            context: .
            file: ./Dockerfile
            image: ghcr.io/tompulsen/ai-community
          - name: documents
            context: .
            file: ./deploy/documents/Dockerfile
            image: ghcr.io/tompulsen/ai-community-documents
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Verify deployment safety
        run: python3 -m unittest discover -s deploy/community -p 'test_*.py'

      - name: Sign in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Verify published manifest
        run: docker buildx imagetools inspect "${{ matrix.image }}@${{ steps.build.outputs.digest }}"
