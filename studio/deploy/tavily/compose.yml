services:
  tavily:
    build: .
    container_name: ZY-tavily
    restart: unless-stopped
    environment:
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      TAVILY_API_KEYS: ${TAVILY_API_KEYS:-}
      TAVILY_PROXY_KEY: ${TAVILY_PROXY_KEY:?Set a random TAVILY_PROXY_KEY in .env}
    ports:
      - "127.0.0.1:${TAVILY_PORT:-18093}:18093"
    networks:
      new-api:
        aliases:
          - tavily
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:18093/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

networks:
  new-api:
    external: true
    name: ${TAVILY_NEW_API_NETWORK:-1panel-network}
