<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg" overflow="visible">
  <!-- 钢笔：50°倾斜，4:1长宽比，修长利落 -->
  <g transform="translate(10.5, 6.5) rotate(-50)">
    <!-- 笔身：闭合空心长条，14px长3.5px宽，rx=1.75 -->
    <rect x="-7" y="-1.75" width="14" height="3.5" rx="1.75"/>
    <!-- 内部留白线 -->
    <line x1="-5.5" y1="0" x2="5.5" y2="0"/>
  </g>
  <!-- 底部横线：长度≈笔身1/2=7px，向右偏移，左端对齐笔尖下方 -->
  <line x1="7" y1="18.5" x2="14" y2="18.5"/>
</svg>